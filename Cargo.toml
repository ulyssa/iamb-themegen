[package]
name = "iamb-themegen"
version = "0.1.0"
edition = "2024"
authors = ["Ulyssa <git@ulyssa.dev>"]
repository = "https://github.com/ulyssa/iamb-themegen"
homepage = "https://iamb.chat"
readme = "README.md"
description = "A tool for converting Vim colorschemes into iamb themes"
license = "Apache-2.0"
exclude = [".github", "CONTRIBUTING.md"]

[dependencies]
anyhow = "1.0"
askama = "0.16.1"
clap = {version = "^4.6", features = ["derive"]}
palette = "0.7.7"
ratatui = { version = "0.30.2", features = ["palette", "serde"] }
serde = "1.0"
serde_json = "1.0"
